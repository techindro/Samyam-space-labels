version: '3.8'

services:
  # React Frontend Web App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samyam-frontend
    ports:
      - "8080:80"
    environment:
      - VITE_FASTAPI_URL=http://localhost:8000
    depends_on:
      - ai-engine
    restart: always

  # Python FastAPI AI Engine (CLIP, ISRO Satellite Inference & Kafka Producer/Consumer)
  ai-engine:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: samyam-ai-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    restart: always

  # Apache Kafka Zookeeper Service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: samyam-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Apache Kafka Event Streaming Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: samyam-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
