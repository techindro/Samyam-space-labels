name: CI/CD Pipeline - Build, Test & Docker Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/samyam-frontend
  AI_ENGINE_IMAGE_NAME: ${{ github.repository }}/samyam-ai-engine

jobs:
  # ── Job 1: Test & Lint Frontend ──────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Lint, Test & Build)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Run Build Test
      run: npm run build

  # ── Job 2: Python AI Engine CI ────────────────────────────────────────────
  ai-engine-ci:
    name: AI Engine CI (Python Backend)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: python/requirements.txt

    - name: Install System Dependencies (GDAL, Rasterio)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgdal-dev libproj-dev gdal-bin
        export GDAL_CONFIG=/usr/bin/gdal-config

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements.txt pytest

  # ── Job 3: Build & Push Docker Images ─────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker Images
    needs: [frontend-ci, ai-engine-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Metadata for Frontend
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
        tags: |
          type=raw,value=latest
          type=sha

    - name: Build & Push Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

    - name: Extract Metadata for AI Engine
      id: meta-ai
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.AI_ENGINE_IMAGE_NAME }}
        tags: |
          type=raw,value=latest
          type=sha

    - name: Build & Push AI Engine Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./python
        file: ./python/Dockerfile
        push: true
        tags: ${{ steps.meta-ai.outputs.tags }}
        labels: ${{ steps.meta-ai.outputs.labels }}
