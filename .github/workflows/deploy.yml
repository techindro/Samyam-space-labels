name: CI/CD Pipeline - Build, Test & Docker Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: samyam-frontend
  AI_ENGINE_IMAGE: samyam-ai-engine

jobs:
  # ── Job 1: Test & Lint Frontend ──────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Test & Build)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Run Tests
      run: npm test

    - name: Run Build Test
      run: npm run build

  # ── Job 2: Python AI Engine CI ────────────────────────────────────────────
  ai-engine-ci:
    name: AI Engine CI (Python Backend)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install fastapi uvicorn pydantic httpx pillow requests numpy pytest pytest-asyncio python-multipart
        if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt || true; fi

    - name: Validate Backend Server Syntax
      run: |
        python -m py_compile python/app/main.py
        python -m py_compile python/samyam_lm_multimodal/serve_samyam_lm.py
        python -m py_compile python/samyam_lm_multimodal/eval_benchmark.py

    - name: Run PyTest & Unit Tests
      env:
        PYTHONPATH: ${{ github.workspace }}/python/app:${{ github.workspace }}/python:${{ github.workspace }}/python/samyam_lm_multimodal:${{ github.workspace }}
      run: |
        python python/run_tests.py

    - name: Run Benchmark Evaluation Smoke Test
      env:
        PYTHONPATH: ${{ github.workspace }}/python/samyam_lm_multimodal:${{ github.workspace }}/python:${{ github.workspace }}
      run: |
        python python/samyam_lm_multimodal/eval_benchmark.py --demo

  # ── Job 3: Build & Validate Docker Containers ─────────────────────────────
  docker-build-push:
    name: Docker Build Validation
    needs: [frontend-ci, ai-engine-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Lowercase Image Names
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${REPO_LOWER}/samyam-frontend" >> $GITHUB_ENV
        echo "AI_ENGINE_IMAGE=${{ env.REGISTRY }}/${REPO_LOWER}/samyam-ai-engine" >> $GITHUB_ENV

    - name: Build Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: ${{ env.FRONTEND_IMAGE }}:latest

    - name: Build AI Engine Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./python
        file: ./python/Dockerfile
        push: false
        tags: ${{ env.AI_ENGINE_IMAGE }}:latest
