<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <!-- USGS Official Green Background Emblem -->
  <rect x="10" y="10" width="120" height="120" rx="8" fill="#007a4d"/>
  
  <!-- Waves inside emblem -->
  <path d="M10 65 Q 40 40, 70 65 T 130 65 L 130 80 Q 100 55, 70 80 T 10 80 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M10 85 Q 40 60, 70 85 T 130 85 L 130 100 Q 100 75, 70 100 T 10 100 Z" fill="#ffffff" opacity="0.9"/>
  
  <!-- USGS Text -->
  <text x="145" y="110" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="105" fill="#007a4d" letter-spacing="-3">USGS</text>
  
  <!-- Subtitle Text -->
  <text x="12" y="165" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="34" fill="#007a4d">science for a changing world</text>
</svg>
